spring:
  config:
    activate:
      on-profile: dev
  batch:
    job:
      enabled: true
    jdbc:
      initialize-schema: always
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari.maximum-pool-size: 10
  h2:
    console:
      enabled: true
      path: /h2-console
