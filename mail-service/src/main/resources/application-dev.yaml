spring:
  config:
    activate:
      on-profile: dev
  devtools:
    add-properties: true
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5431}/postgres
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    jpa:
      show-sql: false
      hibernate:
        ddl-auto: none
  kafka:
    bootstrap-servers: localhost:29092
    topic: send-email-register-topic
  sendgrid:
    api-key: ${SENDGRID_KEY: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}


openapi:
  service:
    api-docs: mail-service
    server: http://localhost:${server.port}
    title:  Mail service
    version: 1.0.0